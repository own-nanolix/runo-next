<section class="page is-active" id="p-use-print" aria-label="Brand in use — Stationery &amp; print">
<style>
/* light from top-left: every shadow falls down and to the right */
#p-use-print{--sh:1px 1px 2px rgba(20,34,58,.14),4px 8px 14px -3px rgba(20,34,58,.2),14px 26px 40px -14px rgba(20,34,58,.34);

#p-use-print .up-sub{font-size:clamp(26px,3.2vw,48px);line-height:1.08;letter-spacing:-.03em;margin-top:8px}
#p-use-print .up-nav{display:flex;flex-wrap:wrap;gap:6px 30px;margin-top:30px;font-size:15px}
#p-use-print .up-nav a{position:relative;padding:8px 0;color:var(--ink-2);transition:color .25s}
#p-use-print .up-nav a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
#p-use-print .up-nav a:hover{color:var(--ink)}#p-use-print .up-nav a:hover::after,#p-use-print .up-nav a[aria-current]::after{transform:scaleX(1)}
#p-use-print .up-nav a[aria-current]{color:var(--ink)}
#p-use-print .up-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(16px,2vw,28px)}
@media(min-width:1000px){#p-use-print .up-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#p-use-print .up-wide{grid-column:1/-1}}

/* tile = stage + caption */
#p-use-print .up-tile{display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line);min-width:0;cursor:default}
#p-use-print .up-tile:focus-visible{outline:none;box-shadow:0 0 0 2px var(--accent-ink)}
#p-use-print .up-stage{flex:1;position:relative;container-type:inline-size;min-height:420px;display:grid;place-items:center;padding:48px 20px;perspective:1400px;isolation:isolate;overflow:hidden}

#p-use-print .up-stage>*{position:relative;z-index:1}
#p-use-print .st-sand{background:var(--sand)}#p-use-print .st-page{background:var(--page)}#p-use-print .st-blue{background:var(--blue)}#p-use-print .st-sky2{background:#DDE6F3}
#p-use-print .st-black{background:#000}#p-use-print .st-black::before{opacity:.1}
#p-use-print .up-tilt{display:grid;place-items:center;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .7s var(--ease)}
#p-use-print .up-cap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 16px;align-items:baseline;padding:18px 24px 22px;background:#fff;border-top:1px solid var(--line-2)}
#p-use-print .up-n{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
#p-use-print .up-name{font-size:19px;font-weight:400;letter-spacing:-.02em;line-height:1.25}
#p-use-print .up-spec{grid-column:2;font-size:13px;color:var(--ink-3);line-height:1.4}

/* object unit: 1em = 1mm of the real item, scaled to the stage */
#p-use-print .o{--k:var(--k0);position:relative;flex:none;font-size:min(calc(var(--k)*1cqw),calc(var(--k)*var(--cap,7.6px)));color:var(--ink);line-height:1.3}
#p-use-print .up-wide .o{--cap:11px}
@container (max-width:520px){#p-use-print .o{--k:calc(var(--k0)*var(--sm,1.3))}}
#p-use-print .mk{fill:currentColor;display:block;flex:none}
#p-use-print .ct{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:currentColor;pointer-events:none}
#p-use-print .ct path{vector-effect:non-scaling-stroke;stroke-width:.8px}
#p-use-print .up-bars{position:absolute}#p-use-print .up-bars svg{width:100%;height:100%;max-width:none}
#p-use-print .lbl{font-size:2.5em;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
#p-use-print .hr{position:absolute;left:20em;right:20em;height:0;border-top:1px solid #E2E5E9}

/* 01 business cards */
#p-use-print .bc{width:99em;height:73em;perspective:260em}
#p-use-print .bc-c{position:absolute;width:85em;height:55em;transform-style:preserve-3d;transition:transform 1.1s var(--ease)}
#p-use-print .bc-c.a{left:0;top:0;z-index:2}#p-use-print .bc-c.b{left:14em;top:18em;z-index:1;transition-delay:.14s}
#p-use-print .up-tile.on .bc-c{transform:rotateY(180deg)}#p-use-print .up-tile.on .bc-c.b{transform:translate(6em,6em) rotateY(180deg)}#p-use-print .up-tile.on .bc-c.a{transform:translate(-4em,-4em) rotateY(180deg)}
#p-use-print .bc-f{position:absolute;inset:0;border-radius:2.4em;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--sh)}

#p-use-print .bc-f::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset .25em .25em 0 rgba(255,255,255,.45),inset -.25em -.3em 0 rgba(20,34,58,.14)}
#p-use-print .bc-f.dk::after,#p-use-print .bc-f.b::after{box-shadow:inset .25em .25em 0 rgba(255,255,255,.16),inset -.25em -.3em 0 rgba(0,0,0,.5)}
#p-use-print .bc-f.a{background:var(--blue);display:grid;place-items:center;color:#000}#p-use-print .bc-f.a .mk{width:17em;height:17em}
#p-use-print .bc-f.b{background:#000;color:#fff}#p-use-print .bc-f.b .mk{position:absolute;left:7em;bottom:7em;width:12em;height:12em}
#p-use-print .bc-f.lt{background:#fff;color:#000}#p-use-print .bc-f.dk{background:#000;color:#fff}
#p-use-print .bc-mk{position:absolute;left:6em;top:6em;width:7em;height:7em}
#p-use-print .bc-t{position:absolute;left:6em;bottom:5.6em;display:grid;gap:.7em}

#p-use-print .bc-t span{font-size:2.9em;line-height:1.15}
#p-use-print .bc-f.lt .bc-t span{color:var(--ink-2)}#p-use-print .bc-f.dk .bc-t span{color:#C9D3DE}

/* 02 letterhead + 06 invoice (A4 sheets) */

#p-use-print .sh.lh-bk{transform:translate(3em,2.4em) rotate(1.4deg);box-shadow:var(--sh);background:#FBFBFB;overflow:hidden}

#p-use-print .up-tile.on .lh-bk{transform:translate(5em,3em) rotate(2.2deg)}
#p-use-print .lh-mk{position:absolute;left:20em;top:19em;width:11em;height:11em}

#p-use-print .lh-body i{display:block;height:1.5em;border-radius:1em;background:#E7E9ED}

  box-shadow:.3em .3em 0 #BAD5F3,.6em .6em 0 #DDEAF9,.9em .9em 0 #BAD5F3,1.2em 1.2em 0 #DDEAF9,1.5em 1.5em 0 #BAD5F3,1.5em 1.8em 1em rgba(20,34,58,.3),var(--sh);
  background-image:radial-gradient(circle,#B8C2CF .5px,transparent .9px);background-size:5em 5em;background-position:2.5em 2.5em}

#p-use-print .nb-dm{position:absolute;left:50%;top:41%;width:44em;height:44em;margin:-22em 0 0 -22em}
