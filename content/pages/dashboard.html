<section class="page is-active" id="p-dashboard" aria-label="Dashboard — 7 screens">
<style>
#p-dashboard{--tx:#27425F;--hair:rgba(11,11,12,.08)}
#p-dashboard button{cursor:pointer}
#p-dashboard .d-intro{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between;padding:clamp(28px,4vw,56px) var(--pad) 20px}
#p-dashboard .d-intro .small{max-width:420px}

/* ---- screen switcher rail ---- */
#p-dashboard .d-rail{display:flex;gap:12px;overflow-x:auto;padding:6px var(--pad) 18px;scrollbar-width:thin;scroll-snap-type:x proximity}
#p-dashboard .d-rail button{flex:none;width:148px;text-align:left;scroll-snap-align:start;border-radius:16px;padding:8px 8px 10px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);
  transition:transform .35s var(--ease),box-shadow .25s,background .25s;display:flex;flex-direction:column;gap:8px}
#p-dashboard .d-rail button:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1px #C5D3E6,0 14px 28px -18px rgba(40,70,110,.45)}
#p-dashboard .d-rail button:active{transform:translateY(-1px) scale(.98)}
#p-dashboard .d-rail button[aria-selected="true"]{background:#000;color:#fff;box-shadow:none}
#p-dashboard .d-rail svg.th{width:100%;height:auto;border-radius:10px;background:#F3F5F8}
#p-dashboard .d-rail button[aria-selected="true"] svg.th{background:#1b1c1f}
#p-dashboard .d-rail .tn{display:flex;align-items:baseline;gap:8px;padding:0 4px;font-size:13px;white-space:nowrap}
#p-dashboard .d-rail .tn b{font-weight:400;font-variant-numeric:tabular-nums;color:var(--ink-3)}
#p-dashboard .d-rail button[aria-selected="true"] .tn b{color:#B9C7D8}

/* ---- app frame ---- */
#p-dashboard .d-appwrap{padding:0 var(--pad)}
#p-dashboard .d-app{position:relative;background:var(--page);border-radius:28px;box-shadow:0 0 0 1px var(--line),0 50px 100px -60px rgba(40,60,90,.4);min-height:760px;overflow:hidden;color:var(--ink)}
#p-dashboard .d-sky{position:absolute;left:0;right:0;top:0;height:390px;opacity:0;transition:opacity .6s var(--ease);pointer-events:none;
  background:linear-gradient(180deg,#9FC0EE 0%,#BED3F2 38%,#E3EAF4 78%,var(--page) 100%)}
#p-dashboard .d-app[data-sky="1"] .d-sky{opacity:1}
#p-dashboard .d-sky svg{position:absolute;inset:0;width:100%;height:100%}
#p-dashboard .d-sky .ring{transform-box:fill-box;transform-origin:center;animation:dashboard-spin 120s linear infinite}
#p-dashboard .d-sky .ring.r{animation-direction:reverse;animation-duration:170s}
@keyframes dashboard-spin{to{transform:rotate(360deg)}}

#p-dashboard .d-head{position:relative;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 clamp(16px,2.2vw,32px);border-bottom:1px solid var(--hair);height:76px;transition:border-color .5s}
#p-dashboard .d-app[data-sky="1"] .d-head{border-bottom-color:rgba(255,255,255,.55);color:var(--tx)}
#p-dashboard .d-brand{display:inline-flex;align-items:center;gap:10px;font-size:14px;justify-self:start;border-radius:8px;padding:6px 4px}
#p-dashboard .d-brand .mark{width:20px;height:20px}
#p-dashboard .d-tabs{overflow-x:auto;scrollbar-width:none;max-width:100%}
#p-dashboard .d-tabs::-webkit-scrollbar{display:none}
#p-dashboard .d-tabs-in{position:relative;display:inline-flex;gap:clamp(4px,2vw,28px);height:76px;align-items:stretch}
#p-dashboard .d-tabs-in button{padding:0 clamp(10px,1.6vw,22px);font-size:14px;transition:opacity .2s,transform .25s var(--ease);opacity:.85;white-space:nowrap}
#p-dashboard .d-tabs-in button:hover{opacity:1;transform:translateY(-1px)}
#p-dashboard .d-tabs-in button:active{transform:scale(.97)}
#p-dashboard .d-tabs-in button[aria-current="page"]{opacity:1}
#p-dashboard .d-ink{position:absolute;bottom:0;left:0;height:2px;width:60px;background:var(--steel-deep);border-radius:2px;transition:transform .55s var(--ease),width .55s var(--ease),opacity .3s;opacity:0}
#p-dashboard .d-menuwrap{position:relative;justify-self:end}
#p-dashboard .d-menu-btn{height:36px;font-size:13px;gap:8px}
#p-dashboard .d-menu-btn .icon{width:14px;height:14px}
#p-dashboard .d-menu-btn[aria-expanded="true"] .icon:last-child{transform:rotate(180deg)}
#p-dashboard .d-menu-btn .icon:last-child{transition:transform .3s var(--ease)}
#p-dashboard .d-menu,#p-dashboard .d-drop{position:absolute;z-index:30;top:calc(100% + 8px);background:#fff;color:var(--ink);border-radius:14px;padding:6px;min-width:236px;box-shadow:0 24px 50px -22px rgba(30,50,80,.4),0 0 0 1px rgba(0,0,0,.06);
  opacity:0;visibility:hidden;transform:translateY(-6px);transition:.25s var(--ease)}
#p-dashboard .d-menu{right:0}
#p-dashboard .d-drop{left:0;min-width:280px}
#p-dashboard .open>.d-menu,#p-dashboard .open>.d-drop{opacity:1;visibility:visible;transform:none}
#p-dashboard .d-menu button,#p-dashboard .d-drop button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px;transition:background .2s,padding .3s var(--ease)}
#p-dashboard .d-menu button:hover,#p-dashboard .d-drop button:hover{background:var(--subtle);padding-left:16px}
#p-dashboard .d-menu button[aria-current="true"],#p-dashboard .d-drop button[aria-current="true"]{background:#EAF1FA}
#p-dashboard .d-menu b{font-weight:400;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;width:20px}

/* ---- stage ---- */
#p-dashboard .d-stage{position:relative;z-index:2;padding:0 clamp(16px,2.2vw,32px) 40px;min-height:620px;transition:opacity .16s ease,transform .16s ease}
#p-dashboard .d-stage.is-out{opacity:0;transform:translateY(-6px)}
#p-dashboard .d-stage.is-in{animation:dashboard-in .75s var(--ease) both}
@keyframes dashboard-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#p-dashboard .d-stage:focus{outline:0}
#p-dashboard .d-hero{padding:clamp(26px,4vw,54px) 0 clamp(20px,3vw,40px);min-height:230px}
#p-dashboard .d-welcome{font-size:clamp(38px,5vw,76px);line-height:1.04;letter-spacing:-.035em;font-weight:400;color:#fff}
#p-dashboard .d-welcome span{display:block;opacity:.88}
#p-dashboard .d-ctl-title{font-size:clamp(26px,3.4vw,50px);line-height:1.12;letter-spacing:-.035em;font-weight:300;color:#5C7CA6;max-width:880px}
#p-dashboard .d-ctl-title .num{color:#fff;font-weight:300}
#p-dashboard .d-eur{display:inline-flex;align-items:center;height:.55em;min-height:22px;padding:0 10px;border-radius:999px;font-size:13px;letter-spacing:0;box-shadow:inset 0 0 0 1.5px var(--teal);color:#0E6F5E;vertical-align:.2em;margin:0 6px;font-weight:400}
#p-dashboard .d-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 22px;flex-wrap:wrap}
#p-dashboard .d-acct{position:relative}
#p-dashboard .d-acct>button{display:inline-flex;align-items:center;gap:12px;font-size:clamp(20px,1.9vw,26px);letter-spacing:-.025em;padding:4px 6px;margin-left:-6px;border-radius:8px;transition:background .2s}
#p-dashboard .d-acct>button:hover{background:rgba(255,255,255,.6)}
#p-dashboard .d-acct>button .icon{width:14px;height:14px;color:var(--ink-3);transition:transform .3s var(--ease)}
#p-dashboard .d-acct.open>button .icon{transform:rotate(180deg)}

/* ---- cards ---- */
#p-dashboard .d-grid{display:grid;gap:clamp(12px,1.4vw,20px);align-items:stretch}
#p-dashboard .d-g1{grid-template-columns:minmax(0,.82fr) minmax(0,1fr) minmax(0,1.1fr)}
#p-dashboard .d-g2{grid-template-columns:minmax(0,1fr) 360px;gap:clamp(16px,2.4vw,40px)}
#p-dashboard .d-g3{grid-template-columns:minmax(240px,.7fr) minmax(220px,.7fr) minmax(0,1.8fr)}
#p-dashboard .d-g4{grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);gap:clamp(14px,1.8vw,28px)}
#p-dashboard .d-g5{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
#p-dashboard .d-g6{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
#p-dashboard .d-card{background:#fff;border-radius:22px;padding:clamp(16px,1.6vw,22px);position:relative;min-width:0;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
#p-dashboard .d-card.lift:hover{transform:translateY(-3px);box-shadow:0 24px 40px -28px rgba(40,70,110,.35)}
#p-dashboard .d-card.sand{background:var(--sand)}
#p-dashboard .d-lbl{font-size:12px;color:var(--ink-3);letter-spacing:0}
#p-dashboard .d-big{font-size:clamp(26px,2.4vw,34px);letter-spacing:-.03em;line-height:1.1}
#p-dashboard .d-ctrl{display:flex;gap:8px}
#p-dashboard .d-card .icon-btn{width:32px;height:32px}
#p-dashboard .d-card .icon-btn .icon{width:14px;height:14px}
#p-dashboard .d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#p-dashboard .d-chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;background:#F0F1F3;color:var(--ink-2);vertical-align:middle}
#p-dashboard .d-chip.up{background:#fff;box-shadow:inset 0 0 0 1px var(--teal);color:#0E6F5E}
#p-dashboard .d-chip .icon{width:10px;height:10px}
#p-dashboard .d-h3{font-size:clamp(20px,1.6vw,24px);letter-spacing:-.025em;line-height:1.18;font-weight:400}
#p-dashboard .d-btn{height:38px;font-size:13px}
#p-dashboard .d-scroll{overflow-x:auto}

/* donut */
#p-dashboard .d-donut{position:relative;width:min(100%,250px);margin:6px auto 0;aspect-ratio:1}
#p-dashboard .d-donut svg{width:100%;height:100%;overflow:visible}
#p-dashboard .d-donut circle.seg{fill:none;stroke-width:18;transition:stroke-width .3s var(--ease),opacity .3s;cursor:pointer;animation:dashboard-draw 1.3s var(--ease) both;animation-delay:var(--dl)}
#p-dashboard .d-donut circle.seg.on{stroke-width:24}
#p-dashboard .d-donut.hov circle.seg:not(.on){opacity:.35}
@keyframes dashboard-draw{from{stroke-dasharray:0 var(--C)}}
#p-dashboard .d-donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
#p-dashboard .d-donut .mid b{font-weight:400;font-size:clamp(24px,2.2vw,30px);letter-spacing:-.03em}
#p-dashboard .d-donut .pc{position:absolute;translate:-50% -50%;font-size:11px;padding:1px 7px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px var(--line);transition:transform .3s var(--ease);pointer-events:none}
#p-dashboard .d-leg{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:12px}
#p-dashboard .d-leg button{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);border-radius:6px;padding:2px 4px;transition:background .2s}
#p-dashboard .d-leg button:hover,#p-dashboard .d-leg button.on{background:var(--subtle)}
#p-dashboard .d-leg i{width:7px;height:7px;border-radius:50%}

/* cash overview */
#p-dashboard .d-cbars{display:flex;gap:2px;height:128px;align-items:flex-end;margin:-6px -6px 0;border-radius:14px 14px 0 0;overflow:hidden}
#p-dashboard .d-cb{position:relative;flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;font-size:10px;color:var(--ink-2);padding-bottom:6px;cursor:default}
#p-dashboard .d-cb i{position:absolute;left:0;right:0;bottom:0;background:#E8EEF8;transform-origin:bottom;animation:dashboard-up .9s var(--ease) both;animation-delay:calc(var(--i)*70ms);transition:background .25s}
#p-dashboard .d-cb:hover i,#p-dashboard .d-cb:focus-visible i{background:#CFE0F8}
#p-dashboard .d-cb span{position:relative}
@keyframes dashboard-up{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#p-dashboard .d-mt{margin-top:22px}

/* balance rows */
#p-dashboard .d-rows{margin:20px -22px -22px}
#p-dashboard .d-bal{display:grid;grid-template-columns:36px minmax(0,1.5fr) minmax(0,1fr) 60px auto;gap:10px;align-items:center;padding:14px 22px;border-top:1px solid var(--line-2);font-size:12px;transition:background .25s}
#p-dashboard .d-bal:hover{background:#FBFBFC}
#p-dashboard .d-bal .tile{width:34px;height:34px;border-radius:8px;background:#EEF0F3;display:grid;place-items:center;color:#B7BDC7}
#p-dashboard .d-bal .tile .mark{width:15px;height:15px}
#p-dashboard .d-bal b{font-weight:500;display:block;font-size:12.5px}
#p-dashboard .d-bal small{display:block;color:var(--ink-3);font-size:11px}
#p-dashboard .d-bal .btn{height:32px;font-size:12px;padding:0 14px}
@media(max-width:560px){#p-dashboard .d-bal{grid-template-columns:34px 1fr auto;row-gap:6px}#p-dashboard .d-bal>div:nth-child(3),#p-dashboard .d-bal>div:nth-child(4){grid-column:2}#p-dashboard .d-bal .btn{grid-column:3;grid-row:1}}

/* cash flow */
#p-dashboard .d-kpis{display:flex;flex-wrap:wrap;padding:26px 0 22px;border-bottom:1px solid var(--line)}
#p-dashboard .d-kpi{padding:0 clamp(18px,3vw,48px) 0 0;margin-right:clamp(18px,3vw,48px);border-right:1px solid var(--line)}
#p-dashboard .d-kpi:last-child{border:0}
#p-dashboard .d-kpi .d-big{display:flex;align-items:center;gap:10px;margin-top:6px}
#p-dashboard .d-blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6vw,24px);padding:26px 0 0}
#p-dashboard .d-blk{position:relative;padding-left:9px}
#p-dashboard .d-blk::before{content:"";position:absolute;left:0;bottom:0;width:1.6px;height:70%;background:var(--bc)}
#p-dashboard .d-blk .v{font-size:20px;letter-spacing:-.02em;margin:4px 0 10px}
#p-dashboard .hbg .bar{transform-box:fill-box;transform-origin:50% 100%;animation:dashboard-up .9s var(--ease) both;animation-delay:calc(var(--i)*8ms);transition:filter .2s}
#p-dashboard .hbg .hit{fill:transparent}
#p-dashboard .hbg:hover .bar{filter:brightness(.62)}
#p-dashboard .d-ftabs{display:flex;gap:clamp(14px,2.2vw,34px);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:8px 0 18px;padding:12px 0 0}
#p-dashboard .d-ftabs::-webkit-scrollbar{display:none}
#p-dashboard .d-ftabs button{flex:none;position:relative;font-size:12px;letter-spacing:.02em;color:var(--ink-3);padding:0 4px 12px;transition:color .2s}
#p-dashboard .d-ftabs button:hover{color:var(--ink)}
#p-dashboard .d-ftabs button[aria-selected="true"]{color:var(--ink)}
#p-dashboard .d-ftabs button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#4FA3F2;transform:scaleX(0);transition:transform .45s var(--ease)}
#p-dashboard .d-ftabs button[aria-selected="true"]::after{transform:scaleX(1)}
#p-dashboard .d-ftabs .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4FA3F2;margin-left:6px}
#p-dashboard .d-run{background:var(--sand);border-radius:22px;padding:clamp(16px,2vw,26px)}
#p-dashboard .d-run-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
#p-dashboard .d-seg{display:inline-flex;background:#ECE9E1;border-radius:999px;padding:3px}
#p-dashboard .d-seg button{height:32px;padding:0 16px;border-radius:999px;font-size:12px;color:var(--ink-3);transition:background .25s,color .25s,box-shadow .25s}
#p-dashboard .d-seg button:hover{color:var(--ink)}
#p-dashboard .d-seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.05)}
#p-dashboard .d-run .btn-go{width:36px;height:36px;border-radius:50%;background:var(--steel-btn);color:#fff;display:grid;place-items:center;transition:background .25s,transform .35s var(--ease)}
#p-dashboard .d-run .btn-go:hover{background:var(--steel-deep);transform:rotate(45deg)}
#p-dashboard .d-run-mid{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-top:16px;flex-wrap:wrap}
#p-dashboard .d-run-mid p{max-width:300px;font-size:11px;line-height:1.35;color:var(--ink-3)}
#p-dashboard .d-run-fig{display:flex;gap:28px;text-align:right}
#p-dashboard .d-run-fig b{display:block;font-weight:400;font-size:16px;margin-top:2px}
#p-dashboard .d-strip{position:relative;margin-top:44px;padding-top:34px}
#p-dashboard .d-mk{position:absolute;top:0;height:calc(100% - 0px);border-left:2px solid #2F6FB8;padding-left:6px;font-size:11px;line-height:1.2;color:var(--ink-3);pointer-events:none;white-space:nowrap}
#p-dashboard .d-mk b{display:block;font-weight:400;font-size:13px;color:var(--ink)}
#p-dashboard .d-act-h{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 14px}
#p-dashboard .d-act-h h3{font-size:clamp(24px,2vw,30px);font-weight:400;letter-spacing:-.03em}
#p-dashboard .d-link{font-size:11px;color:var(--ink-3);border-radius:4px;padding:2px 4px;transition:color .2s}
#p-dashboard .d-link:hover{color:var(--ink);text-decoration:underline}
#p-dashboard .d-act{background:var(--sand);border-radius:20px;padding:18px 14px 8px}
#p-dashboard .d-day{font-size:15px;padding:4px 8px 12px;border-bottom:1px solid #E4E1D8;margin-bottom:6px}
#p-dashboard .d-day span{color:var(--ink-3)}
#p-dashboard .d-day-g{margin-bottom:22px}
#p-dashboard .d-item{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;padding:8px;border-radius:12px;font-size:12px;transition:background .25s}
#p-dashboard .d-item:hover{background:rgba(255,255,255,.7)}
#p-dashboard .d-item .t{width:36px;height:36px;border-radius:8px;background:#fff;display:grid;place-items:center}
#p-dashboard .d-item small{display:block;font-size:10px;color:var(--ink-3)}
#p-dashboard .d-item em{font-style:normal;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
#p-dashboard .d-sw{width:26px;height:14px}
#p-dashboard .d-empty{padding:26px 8px;font-size:13px;color:var(--ink-3);text-align:center}

/* control */
#p-dashboard .d-list{margin-top:6px}
#p-dashboard .d-li{display:flex;align-items:center;gap:10px;width:100%;padding:9px 6px;border-radius:10px;font-size:12px;text-align:left;transition:background .25s,padding .3s var(--ease)}
#p-dashboard .d-li:hover{background:var(--subtle);padding-left:10px}
#p-dashboard .d-li .ci{width:24px;height:24px;border-radius:50%;background:#F0F1F3;display:grid;place-items:center;color:var(--ink-3)}
#p-dashboard .d-li .ci .icon{width:12px;height:12px}
#p-dashboard .d-li>span{flex:1}#p-dashboard .d-li>.ci{flex:none}
#p-dashboard .d-li em{font-style:normal;font-variant-numeric:tabular-nums}
#p-dashboard .d-dots{margin-top:8px}
#p-dashboard .d-dots .col{transform-box:fill-box;transform-origin:50% 100%;animation:dashboard-up .9s var(--ease) both;animation-delay:calc(var(--i)*18ms);transition:opacity .2s}
#p-dashboard .d-dots .col:hover{opacity:.55}
#p-dashboard .d-dots-l{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);margin-top:4px}
#p-dashboard .d-review{background:radial-gradient(60% 40% at 70% 14%,#fff 0%,rgba(255,255,255,0) 70%),radial-gradient(70% 45% at 55% 20%,#D5E3F3 0%,rgba(213,227,243,0) 70%),linear-gradient(180deg,#F4F6F9,#EEF1F5);display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:340px}
#p-dashboard .d-review::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:22px;top:20px;background:radial-gradient(circle at 40% 40%,#fff,rgba(186,213,243,.5) 60%,transparent 72%);filter:blur(6px);animation:dashboard-float 8s ease-in-out infinite}
@keyframes dashboard-float{50%{transform:translate(-10px,12px) scale(1.06)}}
#p-dashboard .d-review p{font-size:11.5px;line-height:1.45;color:var(--ink-3)}
#p-dashboard .d-tbl{width:100%;border-collapse:separate;border-spacing:0 10px;min-width:600px}
#p-dashboard .d-tbl th{font-weight:400;font-size:12px;color:var(--ink-3);text-align:left;background:#EDEEF0;padding:0 14px;height:40px}
#p-dashboard .d-tbl th:first-child{border-radius:12px 0 0 12px}#p-dashboard .d-tbl th:last-child{border-radius:0 12px 12px 0;text-align:right}
#p-dashboard .d-tbl th button{display:inline-flex;align-items:center;gap:4px;color:inherit;border-radius:4px;transition:color .2s}
